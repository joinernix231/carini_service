version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: carini_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: carini_service
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: carini_user
      MYSQL_PASSWORD: carini_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - carini_network
    command: --default-authentication-plugin=mysql_native_password

  # Redis para cache y colas
  redis:
    image: redis:7-alpine
    container_name: carini_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - carini_network
    command: redis-server --appendonly yes

  # Aplicación Laravel
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: carini_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    networks:
      - carini_network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=carini_service
      - DB_USERNAME=carini_user
      - DB_PASSWORD=carini_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis

  # Nginx
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: carini_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - carini_network
    depends_on:
      - app

  # Worker de colas
  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: carini_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - carini_network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=carini_service
      - DB_USERNAME=carini_user
      - DB_PASSWORD=carini_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    command: php artisan queue:work --verbose --tries=3 --timeout=90

  # Scheduler de Laravel
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: carini_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - carini_network
    depends_on:
      - mysql
      - redis
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=carini_service
      - DB_USERNAME=carini_user
      - DB_PASSWORD=carini_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  carini_network:
    driver: bridge
